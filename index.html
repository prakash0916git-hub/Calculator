<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <div class="display">0</div>
    <div class="buttons">
      <button>C</button>
      <button>&larr;</button>
      <button>%</button>
      <button>&divide;</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>&times;</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>&minus;</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>+</button>

      <button>±</button>
      <button>0</button>
      <button>.</button>
      <button>=</button>
    </div>
    <div class="keyboard-info">
      keyboard: 0–9 + − * / Enter Backspace
    </div>
  </div>

  <!-- Footer calculator ke bahar -->
  <footer>
    © 2026 Prakash Kumar. All rights reserved.<br>
    Made with ❤️ & HTML, CSS, JavaScript
  </footer>

  <script src="script.js"></script>
</body>
</html>
